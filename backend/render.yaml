services:
  - type: web
    name: videothingy-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        generateValue: true
    disk:
      name: videothingy-storage
      mountPath: /app/storage
      sizeGB: 10
