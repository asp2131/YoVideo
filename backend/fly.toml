app = "videothingy-backend"
primary_region = "ord"

[build]

[env]
  PORT = "8000"
  PYTHON_VERSION = "3.11"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  grace_period = "5s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "10s"

[machine]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[deploy]
  release_command = "echo 'Starting VideoThingy backend...'"

[mounts]
  source = "videothingy_storage"
  destination = "/app/storage"
